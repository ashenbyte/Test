<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Domain check</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg: #0b0d10;
      --card: #14181e;
      --text: #eef2f6;
      --muted: #9aa6b2;
      --line: #2a323c;
      --accent: #7dd3fc;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1b2838 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 10%, #1a2430 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    main {
      width: min(560px, 100%);
      background: color-mix(in srgb, var(--card) 88%, transparent);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border-radius: 999px;
      padding: 6px 10px;
      margin-bottom: 18px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 4px rgba(52, 211, 153, .15);
    }
    h1 {
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.1;
      margin: 0 0 10px;
      letter-spacing: -.03em;
    }
    p { margin: 0; color: var(--muted); line-height: 1.55; }
    dl {
      margin: 28px 0 0;
      display: grid;
      gap: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }
    dt { color: var(--muted); }
    dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; word-break: break-all; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="pill"><span class="dot"></span> Live</div>
    <h1>This domain is pointed correctly.</h1>
    <p>If you can read this on your custom domain over HTTPS, GitHub Pages and DNS are working.</p>
    <dl>
      <div class="row">
        <dt>Host</dt>
        <dd><code id="host">—</code></dd>
      </div>
      <div class="row">
        <dt>Protocol</dt>
        <dd><code id="proto">—</code></dd>
      </div>
      <div class="row">
        <dt>Loaded</dt>
        <dd><code id="when">—</code></dd>
      </div>
    </dl>
  </main>
  <script>
    document.getElementById("host").textContent = location.host || "local";
    document.getElementById("proto").textContent = location.protocol.replace(":", "");
    document.getElementById("when").textContent = new Date().toISOString().replace("T", " ").slice(0, 19) + " UTC";
  </script>
</body>
</html>
